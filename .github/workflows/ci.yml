name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke tests + data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libharfbuzz-subset0 \
            libffi-dev \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r framework/requirements.txt pytest

      - name: Validate data (smoke)
        run: |
          mkdir -p results
          python scripts/validate-data.py 2>&1 | tee results/validate-data.log

      - name: Run smoke tests
        run: |
          python -m pytest \
            --junitxml=results/junit.xml \
            2>&1 | tee results/smoke-tests.log

      - name: Archive smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: results/
          retention-days: 30
